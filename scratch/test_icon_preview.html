<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
body { background: #060913; color: #fff; font-family: sans-serif; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 20px; }
.box { background: #0c1424; border: 1px solid #1e3052; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
</style>
</head>
<body>
<h2>Karar Ağacı ve Büyüteç Vektörel İkon Önizleme</h2>

<div class="row">
    <!-- 16x16 Preview -->
    <div class="box">
        <span>16x16 (Favicon boyutu)</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none">
            <circle cx="10" cy="10" r="6.5" stroke="#38BDF8" stroke-width="2"/>
            <path d="M14.6 14.6L20.5 20.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 6.2V9.5M10 9.5L6.8 12.8M10 9.5L13.2 12.8" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="6.2" r="1.3" fill="#38BDF8"/>
            <circle cx="6.8" cy="12.8" r="1.3" fill="#38BDF8"/>
            <circle cx="13.2" cy="12.8" r="1.3" fill="#38BDF8"/>
        </svg>
    </div>

    <!-- 24x24 Preview (Header boyutu) -->
    <div class="box">
        <span>24x24 (Header Logo boyutu)</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
            <circle cx="10" cy="10" r="6.5" stroke="#38BDF8" stroke-width="2"/>
            <path d="M14.6 14.6L20.5 20.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 6.2V9.5M10 9.5L6.8 12.8M10 9.5L13.2 12.8" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="6.2" r="1.3" fill="#38BDF8"/>
            <circle cx="6.8" cy="12.8" r="1.3" fill="#38BDF8"/>
            <circle cx="13.2" cy="12.8" r="1.3" fill="#38BDF8"/>
        </svg>
    </div>

    <!-- 32x32 Preview (Retina Favicon boyutu) -->
    <div class="box">
        <span>32x32 (Retina Favicon)</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none">
            <circle cx="10" cy="10" r="6.5" stroke="#38BDF8" stroke-width="2"/>
            <path d="M14.6 14.6L20.5 20.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 6.2V9.5M10 9.5L6.8 12.8M10 9.5L13.2 12.8" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="6.2" r="1.3" fill="#38BDF8"/>
            <circle cx="6.8" cy="12.8" r="1.3" fill="#38BDF8"/>
            <circle cx="13.2" cy="12.8" r="1.3" fill="#38BDF8"/>
        </svg>
    </div>

    <!-- 64x64 Preview -->
    <div class="box">
        <span>64x64 (Detay görünümü)</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
            <circle cx="10" cy="10" r="6.5" stroke="#38BDF8" stroke-width="2"/>
            <path d="M14.6 14.6L20.5 20.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 6.2V9.5M10 9.5L6.8 12.8M10 9.5L13.2 12.8" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="6.2" r="1.3" fill="#38BDF8"/>
            <circle cx="6.8" cy="12.8" r="1.3" fill="#38BDF8"/>
            <circle cx="13.2" cy="12.8" r="1.3" fill="#38BDF8"/>
        </svg>
    </div>
</div>
</body>
</html>
